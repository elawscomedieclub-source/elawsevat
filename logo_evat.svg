<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1d3c"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <!-- Anneaux quantiques orbitaux -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="8" transform="rotate(-30 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="8" transform="rotate(30 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="#38bdf8" stroke-width="3" transform="rotate(90 256 256)"/>
  <!-- Globe central lumineux -->
  <circle cx="256" cy="256" r="95" fill="radial-gradient" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="4"/>
  <path d="M161 256h190M256 161v190M180 190c40 30 76 30 152 0M180 322c40-30 76-30 152 0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- Noyau quantique central ELAWS -->
  <circle cx="256" cy="256" r="35" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
</svg>
